<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#amberGold)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Glowing Emblem Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#amberGold)" stroke-width="4" stroke-dasharray="8 8" opacity="0.3"/>

  <!-- MYLIFE Emblem: Modern Interlocking Monogram / Life Pulse M -->
  <g filter="url(#glow)">
    <!-- Stylized M with Heartbeat Pulse -->
    <path d="M 140 330 L 140 160 L 210 260 L 256 195 L 302 260 L 372 160 L 372 330" 
          fill="none" 
          stroke="url(#amberGold)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central Vitality Node -->
    <circle cx="256" cy="195" r="18" fill="#fbbf24"/>
    <circle cx="256" cy="195" r="8" fill="#ffffff"/>
  </g>

  <!-- MYLIFE Brand Typography inside icon -->
  <text x="256" y="415" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="10" 
        fill="#f8fafc" 
        text-anchor="middle">
    MYLIFE
  </text>
  <text x="256" y="450" 
        font-family="monospace" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#fbbf24" 
        opacity="0.8" 
        text-anchor="middle">
    LIFE OS · MOBILE
  </text>
</svg>
